openapi: "3.0.3"
info:
  title: User API
  version: "1.0"
  description: API untuk manajemen user
servers:
  - url: http://localhost:8000/api
    description: Local Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
paths:
  /register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        "422":
          description: Validation Error (input invalid)
        "201":
          description: Register user success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string

  /login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        "422":
          description: Validation Error
        "401":
          description: Unauthorized

  /user:
    get:
      tags: [User]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success get current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      tags: [User]
      summary: Edit current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        "200":
          description: Success update current user
  /logout:
    post:
      tags: [User]
      summary: Logout current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success logout
